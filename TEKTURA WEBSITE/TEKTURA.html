  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">TEKTURA LLC</a>

    <input class="nav-toggle" type="checkbox" id="nav-toggle" />
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </label>

    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT US</a>
      <a href="projects.html">OUR PROJECTS</a>
      <a href="services.html">SERVICES</a>
      <a class="active" href="contact.html">CONTACT</a>
    </nav>

    <a class="nav-search" href="contact.html" aria-label="Contact">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm11 3-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
  </div>
</header>

<section class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=1800&q=80');">
  <div class="content">
    <h1>Contact</h1>
    <div class="title-underline"></div>
  </div>
</section>

<section class="section">
  <div class="container narrow">
    <h2 class="section-title center">GET IN TOUCH</h2>

    <div class="contact-grid">
      <div class="contact-card">
        <h3 class="mini-title">TEKTURA LLC</h3>
        <p class="muted">
          Pooler / Savannah, GA<br />
          <strong>Email:</strong> info@tektura-llc.com<br />
          <strong>Phone:</strong> (xxx) xxx-xxxx
        </p>
        <p class="muted">Tell us what you need and we’ll respond within 1 business day.</p>
      </div>

        <form class="contact-form" name="contact" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="contact" />

        <label>Full name
          <input type="text" name="name" required />
         </label>

         <label>Email
         <input type="email" name="email" required />
         </label>

     <label>Message
      <textarea name="message" rows="5" required></textarea>
    </label>

        <button class="btn" type="submit">SEND MESSAGE</button>
    </form>

    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <p>TEKTURA LLC | All Rights Reserved | 2025</p>
    <a class="to-top" href="#">Back to top</a>
  </div>
</footer>

</body>
</html>
